# The checks that run without an iOS simulator (CLAUDE.md, Build and test). The app itself and its UI tests still need
# xcodebuild on a Mac with a simulator.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TCRoofCore, ExcelExport, PVYield and ModuleRules with their tests, at Bangkok time (tools/linux-swift/test.sh).
  # Swift 6.2: the package's swift-tools-version, so the oldest toolchain the manifest allows.
  linux-swift:
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Package tests (Linux)
        run: tools/linux-swift/test.sh --parallel

  # The Master Plan sheet's Apps Script and the assistant's Cloud Function.
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Master Plan sheet script
        run: node --test tools/master-plan-sheet/core.test.js
      - name: Cloud Functions
        working-directory: functions
        run: npm ci && npm test

  # firestore.rules against the emulator (tools/firestore-rules-tests).
  firestore-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Firebase CLI
        run: npm install -g firebase-tools
      - name: Rules tests
        working-directory: tools/firestore-rules-tests
        run: npm ci && npm test

  # Every TCRoofKit test on macOS (the UI modules included). macOS minutes cost ten times Linux's, so it runs on main
  # and by hand rather than on every pull request.
  package-macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Package tests (macOS)
        working-directory: TCRoofKit
        run: swift test --parallel
