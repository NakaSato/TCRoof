<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" font-family="-apple-system, 'Helvetica Neue', 'Sarabun', sans-serif" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#fff"/><text x="40" y="44" fill="#1F3A5F" font-size="24" font-weight="700">Module installation rules (ZNSHINE manual §5) — ModuleRules</text><text x="40" y="70" fill="#5B6B7F" font-size="15">Reference data → one engine → four places a job is checked → block / warn / info → submit and sign-off gates</text><g font-size="15"><text x="40" y="112" fill="#5B6B7F" font-size="13" font-weight="700" letter-spacing="1">VERSIONED JSON</text><rect width="250" height="78" x="40" y="124" fill="#EEF4FB" stroke="#9CB8D8" rx="10"/><text x="58" y="152" fill="#1F3A5F" font-weight="700">Module catalog</text><text x="58" y="176" fill="#334155">ZXM7-UHLDD144 565–595 W</text><text x="58" y="194" fill="#5B6B7F" font-size="12.5">59-model list still to come</text><rect width="250" height="78" x="40" y="216" fill="#EEF4FB" stroke="#9CB8D8" rx="10"/><text x="58" y="244" fill="#1F3A5F" font-weight="700">Mounting profiles</text><text x="58" y="268" fill="#334155">bolt | tracker | 2V | clamp</text><text x="58" y="286" fill="#5B6B7F" font-size="12.5">torque, washer, load ratings</text><rect width="250" height="78" x="40" y="308" fill="#EEF4FB" stroke="#9CB8D8" rx="10"/><text x="58" y="336" fill="#1F3A5F" font-weight="700">Rule set</text><text x="58" y="360" fill="#334155">33 rules, Thai + English</text><text x="58" y="378" fill="#5B6B7F" font-size="12.5">22 block | 10 warn | 1 info</text></g><g fill="none" stroke="#7A8CA3" stroke-width="2" marker-end="url(#a)"><path d="M290 163 C 330 163 330 240 368 248"/><path d="M290 255 L 368 255"/><path d="M290 347 C 330 347 330 270 368 262"/></g><defs><marker id="a" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#7A8CA3" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect width="260" height="210" x="372" y="150" fill="#1F3A5F" rx="12"/><text x="392" y="184" fill="#fff" font-size="19" font-weight="700">RuleEngine</text><text x="392" y="210" fill="#C9D7E8" font-size="14">conditions in code,</text><text x="392" y="228" fill="#C9D7E8" font-size="14">severity + messages from JSON</text><line x1="392" x2="612" y1="246" y2="246" stroke="#3E5C80"/><text x="392" y="272" fill="#fff" font-size="14" font-weight="700">ModuleRules calculators</text><text x="392" y="294" fill="#C9D7E8" font-size="13.5">max modules in series</text><text x="392" y="313" fill="#C9D7E8" font-size="13.5">cable ampacity (1.25 × Isc × Np)</text><text x="392" y="332" fill="#C9D7E8" font-size="13.5">recommended tilt | clamp zone</text><g font-size="15"><text x="690" y="112" fill="#5B6B7F" font-size="13" font-weight="700" letter-spacing="1">WHERE A JOB IS CHECKED</text><rect width="230" height="56" x="690" y="124" fill="#fff" stroke="#9CB8D8" rx="10"/><text x="708" y="150" fill="#1F3A5F" font-weight="700">Survey</text><text x="708" y="170" fill="#5B6B7F" font-size="13">9 rules | altitude, sea, tilt…</text><rect width="230" height="56" x="690" y="190" fill="#fff" stroke="#9CB8D8" rx="10"/><text x="708" y="216" fill="#1F3A5F" font-weight="700">Layout</text><text x="708" y="236" fill="#5B6B7F" font-size="13">19 rules | clamps, strings, cable</text><rect width="230" height="56" x="690" y="256" fill="#fff" stroke="#9CB8D8" rx="10"/><text x="708" y="282" fill="#1F3A5F" font-weight="700">Install (daily report)</text><text x="708" y="302" fill="#5B6B7F" font-size="13">10 rules | torque, washer, crew</text><rect width="230" height="56" x="690" y="322" fill="#fff" stroke="#9CB8D8" rx="10"/><text x="708" y="348" fill="#1F3A5F" font-weight="700">Commission</text><text x="708" y="368" fill="#5B6B7F" font-size="13">ZN-110 | polarity, Voc ±10 V</text></g><g fill="none" stroke="#7A8CA3" stroke-width="2" marker-end="url(#a)"><path d="M632 230 C 660 230 660 152 686 152"/><path d="M632 245 C 660 245 660 218 686 218"/><path d="M632 265 C 660 265 660 284 686 284"/><path d="M632 280 C 660 280 660 350 686 350"/></g><g font-size="15"><text x="975" y="112" fill="#5B6B7F" font-size="13" font-weight="700" letter-spacing="1">RESULT</text><rect width="190" height="56" x="975" y="124" fill="#FDECEA" stroke="#E0433A" rx="10"/><text x="993" y="150" fill="#B42318" font-weight="700">block</text><text x="993" y="170" fill="#7A2A22" font-size="13">stops submit and sign-off</text><rect width="190" height="56" x="975" y="190" fill="#FFF4E0" stroke="#E08A1E" rx="10"/><text x="993" y="216" fill="#A15C00" font-weight="700">warn</text><text x="993" y="236" fill="#7A4A10" font-size="13">needs a written reason</text><rect width="190" height="56" x="975" y="256" fill="#E8F1FB" stroke="#5B9BD5" rx="10"/><text x="993" y="282" fill="#1D4ED8" font-weight="700">info</text><text x="993" y="302" fill="#1F3A5F" font-size="13">a hint only</text></g><g fill="none" stroke="#7A8CA3" stroke-width="2" marker-end="url(#a)"><path d="M920 250 L 970 250"/></g><rect width="1125" height="104" x="40" y="420" fill="#F3F6FA" rx="12"/><text x="62" y="452" fill="#1F3A5F" font-size="15" font-weight="700">Every check keeps its rule-set and catalog versions</text><text x="62" y="476" fill="#334155" font-size="14">A signed report re-opens with the rules it was signed under. Phase 1 (#118): the target and its tests.</text><text x="62" y="500" fill="#334155" font-size="14">Phases 2–5: the survey card, the layout, the daily report checklist and the string test show these results on screen.</text></svg>