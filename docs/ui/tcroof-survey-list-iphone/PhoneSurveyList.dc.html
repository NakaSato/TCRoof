    const PHOTO_TAGS = [['meter', 'มิเตอร์ไฟฟ้า', true], ['mdb', 'ตู้ไฟ / เมนเบรกเกอร์', true], ['roof', 'หลังคา (ภาพรวม)', true], ['structure', 'โครงหลังคา / แป', false], ['inverter', 'จุดติดตั้งอินเวอร์เตอร์', false], ['bill', 'บิลค่าไฟ', false], ['other', 'อื่น ๆ', false]];
    const TIMES = { 0: '09:00', 1: '10:30', 2: '09:30', 3: '13:30', 4: '08:30', 5: '14:00', 6: '10:00', 7: '09:00', 8: '13:00', 9: '15:00' };
    const SECS = ['หลังคา', 'ระบบไฟฟ้า', 'ค่าไฟ', 'รูปบังคับ'], SEC_N = [4, 3, 1, 3], DRAFT_DONE = 2;
    const st = Object.assign({ win: 7 }, this.state || {});
    const inWin = j => st.win === 0 || (j.survey >= TODAY && j.survey < addD(TODAY, st.win));
    const q = st.q || '';
    const list = JOBS.filter(j => q ? (j.project + j.customer + j.code).includes(q) : inWin(j)).sort((a, b) => a.survey - b.survey);
    const saved = i => SURVEYS.filter(s => s.job === i).length;
    const ON = 'background:#fff;box-shadow:0 1px 3px rgba(22,50,92,0.2);font-weight:700;color:#16325C', OFF = 'background:transparent;color:#5B6B82';
    return {
      sub: (q ? 'ผลการค้นหา ' : 'นัดสำรวจ ') + list.length + ' งาน', empty: list.length === 0,
      hasQ: !!q, qTxt: q || 'ค้นหาชื่อลูกค้า หรือรหัสโครงการ', qTxtS: q ? 'color:#16325C;font-weight:700' : 'color:#5B6B82',
      qBoxS: st.qOpen ? 'border:2px solid #1F6FB5;padding-left:11px' : 'border:1px solid #DDE4ED', qOpen: !!st.qOpen,
      qTog: () => this.setState({ qOpen: !st.qOpen }), qClr: e => { if (e && e.stopPropagation) e.stopPropagation(); this.setState({ q: '', qOpen: false }); },
      qSug: ['นพพร', 'สยามแพ็คกิ้ง', 'TCR2569-23404', 'กรีนเพลส'].map(t => ({ t, go: () => this.setState({ q: t, qOpen: false }) })),
      wins: [[7, '7 วัน'], [30, '30 วัน'], [0, 'ทั้งหมด']].map(([v, t]) => ({ t, go: () => this.setState({ win: v }), st: st.win === v ? ON : OFF })),
      cards: list.map(j => {
        const dd = Math.round((j.survey - TODAY) / 864e5), done = j.i === DRAFT_JOB ? DRAFT_DONE : saved(j.i) ? SECS.length : 0;
        const when = (dd === 0 ? 'วันนี้ ' : dd === 1 ? 'พรุ่งนี้ ' : dd < 0 ? (-dd) + ' วันที่แล้ว · ' : 'อีก ' + dd + ' วัน · ') + TIMES[j.i] + ' น.';
        return { project: j.project, code: j.code, kw: kw(j.kw), province: j.province, when, whenSt: dd === 0 ? 'color:#1F6FB5' : 'color:#16325C',
          team: j.team, teamSt: 'color:' + TEAM[j.team] + ';background:' + TEAM[j.team] + '1A', bd: dd === 0 ? '#1F6FB5' : '#DDE4ED',
          pK: done === 0 ? 'ยังไม่เริ่ม' : done === SECS.length ? 'สำรวจครบ' : 'ทำต่อ', pV: done === 0 ? 'เริ่มสำรวจ' : done === SECS.length ? 'ดูแบบสำรวจ' : SECS[done],
          pPct: Math.round(SEC_N.slice(0, done).reduce((a, b) => a + b, 0) / 11 * 100) + '%', pPctSt: done === 0 ? 'color:#9AA6B6' : done === SECS.length ? 'color:#2E7D32' : 'color:#1F6FB5',
          pBg: done > 0 && done < SECS.length ? 'background:#EEF4FB' : 'background:#F3F6FA',
          caps: SECS.map((x, k) => ({ st: 'background:' + (k < done ? '#70AD47' : k === done && done > 0 ? '#1F6FB5' : '#DDE4ED') })),
          aria: j.project + ' ' + when };
      })
    };
  }
}
