<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1257C9"/>
      <stop offset="1" stop-color="#0A2458"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD66B" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFD66B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52B8FF"/>
      <stop offset="1" stop-color="#1A6FE0"/>
    </linearGradient>
    <clipPath id="roofClip">
      <path d="M322 372 L702 372 L812 596 L212 596 Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- sun -->
  <circle cx="770" cy="236" r="200" fill="url(#sunGlow)"/>
  <circle cx="770" cy="236" r="88" fill="#FFC53D"/>

  <!-- house wall -->
  <rect x="262" y="596" width="500" height="224" fill="#E8EEF8"/>
  <rect x="452" y="680" width="120" height="140" rx="12" fill="#0A2458"/>
  <rect x="312" y="650" width="90" height="80" rx="10" fill="#9FC3F2"/>
  <rect x="622" y="650" width="90" height="80" rx="10" fill="#9FC3F2"/>

  <!-- roof frame -->
  <path d="M302 352 L722 352 L852 616 L172 616 Z" fill="#FFFFFF" stroke-linejoin="round"/>

  <!-- solar array on roof face -->
  <g clip-path="url(#roofClip)">
    <rect x="200" y="360" width="624" height="250" fill="url(#panel)"/>
    <g stroke="#FFFFFF" stroke-width="10" fill="none">
      <!-- horizontal rows -->
      <line x1="150" y1="446" x2="874" y2="446"/>
      <line x1="150" y1="522" x2="874" y2="522"/>
      <!-- converging columns (perspective) -->
      <line x1="417" y1="372" x2="362" y2="596"/>
      <line x1="512" y1="372" x2="512" y2="596"/>
      <line x1="607" y1="372" x2="662" y2="596"/>
    </g>
    <!-- sheen -->
    <path d="M322 372 L470 372 L300 596 L212 596 Z" fill="#FFFFFF" opacity="0.12"/>
  </g>
</svg>
