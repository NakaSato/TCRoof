<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>การแจ้งเตือน · iPhone (แบนเนอร์และล็อกหน้าจอ)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="grf.css">
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:Sarabun;src:url(/_blob/d24f28679a46e443412954e7a5c3ee56) format("truetype");font-weight:400}
@font-face{font-family:Sarabun;src:url(/_blob/dcb0af62409156d0e0eb9482cbe81560) format("truetype");font-weight:700}
body{margin:0}
.ios,.ios *{box-sizing:border-box}
.ios{font-family:-apple-system,"SF Pro Text",Sarabun,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.nb{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:22px;background:rgba(246,246,248,0.86);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 6px 24px rgba(0,0,0,0.18);color:#111;text-align:left;border:0;font-family:inherit;cursor:pointer;width:100%}
.nb .aw{position:relative;width:38px;height:38px;flex:none}.nb .ai{width:38px;height:38px;border-radius:9px;display:block}.nb .bg{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 2px rgba(246,246,248,0.95)}.nb .bg svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.nb .ap{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.4px;color:rgba(60,60,67,0.6);text-transform:uppercase;flex:1}
.nb .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nb .hd{display:flex;align-items:baseline;gap:6px}
.nb .tt{display:block;font-size:15px;line-height:20px;font-weight:700;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb .tm{font-size:13px;line-height:18px;color:rgba(60,60,67,0.6);white-space:nowrap}
.nb .bd{font-size:14.5px;line-height:19px;color:#1c1c1e;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nb .sub{font-size:13px;line-height:18px;color:rgba(60,60,67,0.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:700;margin-right:4px}
.acts{border-radius:14px;overflow:hidden;background:rgba(246,246,248,0.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.acts button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:0 16px;border:0;border-top:1px solid rgba(60,60,67,0.18);background:none;font-family:inherit;font-size:16px;color:#111;cursor:pointer}
.acts button:first-child{border-top:0}
.rv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border:1.5px dashed rgba(255,255,255,0.6);border-radius:14px;background:rgba(10,30,60,0.55)}
.rv b{font-size:12px;color:#fff;margin-right:2px}
.rv button{min-height:36px;padding:0 10px;border-radius:9px;border:0;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
</style>
</helmet>
<div class="ios" style="position:relative;width:390px;height:844px;overflow:hidden;background:linear-gradient(170deg,#062C78 0%,#0B5BC4 48%,#2A9D5C 100%);color:#fff">
<sc-if value="{{inApp}}" hint-placeholder-val="{{false}}"><div style="position:absolute;inset:0;background:#F5F8FB;color:#16325C"><div style="height:120px;padding:58px 16px 0;background:#fff;border-radius:0 0 18px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(22,50,92,0.05)"><img src="assets/tc-renewable-icon.png" alt="" style="width:40px;height:40px;border-radius:10px"><i style="flex:1;height:14px;border-radius:7px;background:#E6EBF2"></i><i style="width:44px;height:44px;border-radius:50%;background:#EEF2F7"></i><i style="width:44px;height:44px;border-radius:50%;background:#1F6FB5"></i></div><div style="padding:12px 16px;display:flex;flex-direction:column;gap:8px"><i style="height:180px;border-radius:20px;background:linear-gradient(150deg,#1F6FB5,#16325C)"></i><i style="height:62px;border-radius:16px;background:#fff;border:1px solid #DDE4ED"></i><i style="height:62px;border-radius:16px;background:#fff;border:1px solid #DDE4ED"></i><i style="height:62px;border-radius:16px;background:#fff;border:1px solid #DDE4ED"></i><i style="height:62px;border-radius:16px;background:#fff;border:1px solid #DDE4ED"></i><i style="height:62px;border-radius:16px;background:#fff;border:1px solid #DDE4ED"></i><i style="height:62px;border-radius:16px;background:#fff;border:1px solid #DDE4ED"></i></div></div>
<div style="position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 34px 0 44px;font-size:16px;font-weight:600;color:#16325C"><span>10:00</span><span style="width:26px;height:13px;border:1.5px solid #16325C;border-radius:4px;padding:1px"><i style="display:block;width:70%;height:100%;background:#16325C;border-radius:2px"></i></span></div><div style="position:absolute;left:50%;top:11px;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000"></div>
<sc-if value="{{noExp}}" hint-placeholder-val="{{true}}"><div style="position:absolute;left:8px;right:8px;top:54px"><button class="nb" onClick="{{cur.go}}"><span class="aw"><img class="ai" src="assets/tc-renewable-icon.png" alt="TCRoof"></span><span class="tx"><span class="hd"><span class="ap">TCRoof<span style="text-transform:none;letter-spacing:0;font-weight:700;{{cur.catSt}}"> · {{cur.cat}}</span></span><span class="tm">{{cur.time}}</span></span><span class="tt">{{cur.title}}</span><span class="bd">{{cur.body}}</span><span class="sub">{{cur.sub}}</span></span></button></div></sc-if></sc-if>
<sc-if value="{{onLock}}" hint-placeholder-val="{{true}}">
<div style="position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-size:16px;font-weight:600"><span>TRUE-H</span><span style="width:124px;height:36px;border-radius:20px;background:#000"></span><span style="display:flex;gap:6px;align-items:center"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#fff"><path d="M2 20h3v-5H2zM7 20h3v-8H7zM12 20h3V9h-3zM17 20h3V5h-3z"></path></svg><span style="width:26px;height:13px;border:1.5px solid #fff;border-radius:4px;padding:1px"><i style="display:block;width:70%;height:100%;background:#fff;border-radius:2px"></i></span></span></div>
<div style="position:absolute;top:96px;left:0;right:0;text-align:center"><div style="font-size:18px;font-weight:600;opacity:.9">วันพุธ 30 กันยายน</div><div style="font-size:92px;line-height:100px;font-weight:700;letter-spacing:-2px">10:00</div></div>

<sc-if value="{{noExp}}" hint-placeholder-val="{{true}}"><div style="position:absolute;left:10px;right:10px;bottom:150px;display:flex;flex-direction:column;gap:7px">
<div style="display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:15px;font-weight:600"><span>การแจ้งเตือน</span><span style="font-size:13px;opacity:.85">TCRoof · 4</span></div>
<sc-for list="{{stack}}" as="n" hint-placeholder-count="4"><button class="nb" onClick="{{n.go}}"><span class="aw"><img class="ai" src="assets/tc-renewable-icon.png" alt="TCRoof"></span><span class="tx"><span class="hd"><span class="ap">TCRoof<span style="text-transform:none;letter-spacing:0;font-weight:700;{{n.catSt}}"> · {{n.cat}}</span></span><span class="tm">{{n.time}}</span></span><span class="tt">{{n.title}}</span><span class="bd">{{n.body}}</span><span class="sub">{{n.sub}}</span></span></button></sc-for>
<div style="align-self:center;font-size:13px;font-weight:600;opacity:.85;padding:2px 0">+ อีก 1 รายการ · รอซิงก์ 2 งาน</div>
</div></sc-if>
<div style="position:absolute;left:0;right:0;bottom:92px;display:flex;justify-content:space-between;padding:0 46px"><span style="width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,0.3)"></span><span style="width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,0.3)"></span></div>
</sc-if>

<sc-if value="{{hasExp}}" hint-placeholder-val="{{false}}"><div style="position:absolute;inset:0;background:rgba(0,0,0,0.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)"></div>
<div style="position:absolute;left:10px;right:10px;top:200px;display:flex;flex-direction:column;gap:10px"><button class="nb" onClick="{{exp.go}}" style="padding:14px 16px;border-radius:24px"><span class="aw"><img class="ai" src="assets/tc-renewable-icon.png" alt="TCRoof"></span><span class="tx"><span class="hd"><span class="ap">TCRoof<span style="text-transform:none;letter-spacing:0;font-weight:700;{{exp.catSt}}"> · {{exp.cat}}</span></span><span class="tm">{{exp.time}}</span></span><span class="tt" style="white-space:normal">{{exp.title}}</span><span class="bd">{{exp.body}}</span><span class="sub">{{exp.sub}}</span></span></button><div class="acts"><sc-for list="{{exp.acts}}" as="a" hint-placeholder-count="3"><button onClick="{{a.go}}">{{a.t}}<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:#1c1c1e;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="{{a.ic}}"></path></svg></button></sc-for></div>
<button onClick="{{close}}" style="align-self:center;min-height:44px;padding:0 18px;border-radius:22px;border:0;background:rgba(255,255,255,0.25);color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer">ปิด</button></div></sc-if>

<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}"><div style="position:absolute;left:16px;right:16px;bottom:80px;color:#fff;padding:10px 14px;border-radius:14px;background:rgba(0,0,0,0.6);font-size:13.5px;line-height:19px">{{toast}}</div></sc-if>

<div class="rv" style="position:absolute;left:10px;right:10px;bottom:22px;padding:6px 8px;gap:4px"><sc-for list="{{modes}}" as="m" hint-placeholder-count="2"><button onClick="{{m.go}}" style="{{m.st}}">{{m.t}}</button></sc-for><button onClick="{{nextT}}" style="margin-left:auto;background:rgba(255,255,255,0.18);color:#fff">{{nextTx}} ›</button></div>
<div style="position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#fff"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const N = [["survey", "นัดสำรวจในอีก 30 นาที", "NO.224 กปภ. สาขาตัวอย่าง สถานีผลิตน้ำ 1", "ต.หนองบัว อ.เมือง · 10:30", "ตอนนี้", [["สำรวจ", "background:#E3EEF8;color:#1F6FB5"]], [["นำทาง", "M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12zM12 11.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"], ["เปิดแบบสำรวจ", "M9 4h6v3H9zM7 5.5H6v15h12v-15h-1M9 11h6M9 14h6"], ["เตือนอีก 10 นาที", "M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"]]], ["queue", "ถึงคิวคุณ · DJI Mavic 3T", "สมชายคืนเครื่องและส่งต่อให้คุณ รับได้ที่ห้องเก็บเครื่องมือ", "งาน NO.230 · ใช้ได้ถึง 9/10", "2 นาทีที่แล้ว", [["เครื่องมือ", "background:#E2EFDA;color:#3B7420"]], [["รับเครื่อง · ถ่ายภาพตอนยืม", "M4 8h3l2-3h6l2 3h3v11H4zM12 16a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"], ["ดูคิว", "M4 6h16M4 12h16M4 18h10"], ["สละคิว", "M6 6l12 12M18 6L6 18"]]], ["late", "เกินกำหนดคืน · Fluke 376 FC", "เกิน 1 วัน (กำหนด 29/9) · สมชายรอใช้ต่อ 1/10", "แตะเพื่อคืนพร้อมถ่ายภาพ 3 ภาพ", "08:00", [["ด่วน", "background:#FDECEA;color:#C0392B"]], [["คืนอุปกรณ์", "M19 12H5M11 6l-6 6 6 6"], ["ขอขยายเวลา 1 วัน", "M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"], ["โทรหาผู้รอคิว", "M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"]]], ["cal", "ใกล้ครบกำหนดสอบเทียบ", "Fluke 1587 FC เครื่องวัดฉนวน · ครบ 20/12/2569", "เหลือ 30 วัน · จองส่งสอบเทียบล่วงหน้า", "เมื่อวาน", [["สอบเทียบ", "background:#FFF4E5;color:#B45309"]], [["เปิดทะเบียนเครื่อง", "M3 8h18v12H3zM8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"], ["เตือนอีก 7 วัน", "M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"]]], ["sync", "รอซิงก์ 2 งาน", "ยังไม่ได้บันทึกขึ้น Google Drive", "NO.224 · NO.221 · จะซิงก์เองเมื่อมีสัญญาณ", "23:05", [["ซิงก์", "background:#FFF4E5;color:#B45309"]], [["ซิงก์ตอนนี้", "M20 11a8 8 0 0 0-14.9-3M4 13a8 8 0 0 0 14.9 3M4 4v4h4M20 20v-4h-4"], ["ดูรายการ", "M4 6h16M4 12h16M4 18h10"]]], ["done", "บันทึกขึ้น Drive แล้ว", "NO.224 แบบสำรวจ · 4 ไฟล์ (PDF · Excel · CAD · รูป)", "โฟลเดอร์ TCRoof/2569/NO.224", "29/9 16:42", [["ส่งออก", "background:#E2EFDA;color:#3B7420"]], [["เปิดใน Drive", "M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9a4.5 4.5 0 0 0 1 9z"], ["แชร์ลิงก์", "M4 12v7h16v-7M12 3v12M8 7l4-4 4 4"]]]];
    const s = Object.assign({ exp: null, sel: 'queue', mode: 'app', toast: '' }, this.state || {});
    const set = p => this.setState(Object.assign({}, s, p));
    const BG = { survey: ['#1F6FB5', 'M5 6h14v13H5zM5 10h14M9 4v4M15 4v4'], queue: ['#2E9E5B', 'M5 12.5l4.5 4.5L19 7.5'], late: ['#D9453B', 'M12 7v6M12 17v.5'], cal: ['#F08C00', 'M12 7v5l3 2'], sync: ['#F08C00', 'M12 17V8M8 11l4-4 4 4'], done: ['#7A8BA3', 'M5 12.5l4.5 4.5L19 7.5'] };
    const mk = (n, i) => ({ cat: n[5][0][0], catSt: 'color:' + BG[n[0]][0], id: n[0], title: n[1], body: n[2], sub: n[3], time: n[4], chips: n[5].map(c => ({ t: c[0], st: c[1] })),
      go: () => set({ exp: n[0], toast: '' }),
      acts: n[6].map(a => ({ t: a[0], ic: a[1], go: () => set({ exp: null, toast: 'แตะ "' + a[0] + '" → เปิดแอป TCRoof ที่หน้านั้น' }) })) });
    const all = N.map(mk);
    const byId = id => all.find(n => n.id === id);

    const e = s.exp ? byId(s.exp) : null;
    const T = ['survey', 'queue', 'late', 'cal', 'sync', 'done'];
    const on = 'background:#fff;color:#16325C', off = 'background:rgba(255,255,255,0.18);color:#fff';
    const nx = T[(T.indexOf(s.sel) + 1) % T.length];

      modes: [['lock', 'ล็อกหน้าจอ'], ['app', 'แบนเนอร์ในแอป']].map(([k, t]) => ({ t, go: () => set({ mode: k, exp: null, toast: '' }), st: s.mode === k ? on : off })),
      nextT: () => set({ sel: nx, mode: 'app', exp: null, toast: '' }), nextTx: 'ประเภทถัดไป',
      stack: ['late', 'queue', 'survey'].map(byId), noExp: !e, hasExp: !!e,
