    const mo = st.mo || 0, base = new Date(TODAY.getFullYear(), TODAY.getMonth() + mo, 1), monthEnd = new Date(base.getFullYear(), base.getMonth() + 1, 0);
    const v = {};

    v.isMonth = mode === 'month'; v.isWeek = mode === 'week';

    const TON = 'border:0;background:#16325C;color:#fff', TOFF = 'border:1px solid #C9D3E0;background:#fff;color:#16325C';
    v.teams = [['all', 'ทุกทีม']].concat(Object.keys(TEAM).map(t => [t, t.slice(3)])).map(([k, t]) => ({ t, go: () => this.setState({ tf: k }), st: tf === k ? TON : TOFF,
      dot: k === 'all' ? 'display:none' : 'background:' + TEAM[k] + (tf === k ? ';box-shadow:0 0 0 2px #fff' : ''), aria: k === 'all' ? 'ทุกทีม' : 'ทีม ' + k }));
    const ds = JOBS.filter(j => vis(j) && sameDay(j.survey, sel)), di = inst.filter(j => sel >= instOf(j) && sel <= endOf(j));
    const WDL = ['วันอาทิตย์', 'วันจันทร์', 'วันอังคาร', 'วันพุธ', 'วันพฤหัสบดี', 'วันศุกร์', 'วันเสาร์'];
    v.dWhen = (sameDay(sel, TODAY) ? 'วันนี้ · ' : sameDay(sel, addD(TODAY, 1)) ? 'พรุ่งนี้ · ' : '') + WDL[sel.getDay()];

    v.agenda = ds.map(j => ({ href: 'PhoneSurveyForm.dc.html', aria: 'นัดสำรวจ ' + j.project + ' ' + TIMES[j.i], kind: 'นัดสำรวจ', team: j.team, name: j.project, s: j.code + ' · ' + j.province,

      .concat(di.map(j => { const n = Math.round((sel - instOf(j)) / 864e5) + 1, D = daysOf(j);
        return { href: 'PhonePlanJob.dc.html', aria: 'งานติดตั้ง ' + j.project + ' วันที่ ' + n + ' จาก ' + D, kind: 'งานติดตั้ง', team: j.team, name: j.project, s: j.code + ' · ' + kw(j.kw) + ' · ' + j.province,

    v.dEmpty = !ds.length && !di.length;

    // v3 overrides: simpler day marks, team dropdown, quiet agenda
    v.cells.forEach((c, k) => { const d = addD(start, k), inM = d.getMonth() === base.getMonth(), isSel = sameDay(d, sel), isT = sameDay(d, TODAY);

    v.agenda.forEach(a => { if (!a.prog) a.time = a.time + ' น.'; });

    // v4: month rows with spanning labelled bars
    const nick = j => j.project.replace(/^(คุณ|บริษัท)\s*/, '').split(' ')[0];
    v.mRows = Array.from({ length: rows }, (_, r) => { const days = v.cells.slice(r * 7, r * 7 + 7), w0 = addD(start, r * 7), w6 = addD(w0, 6);
      const bars = inst.filter(j => instOf(j) <= w6 && endOf(j) >= w0).map(j => { const a = Math.max(0, Math.round((instOf(j) - w0) / 864e5)), b = Math.min(6, Math.round((endOf(j) - w0) / 864e5)), c = TEAM[j.team];
        const cont = instOf(j) < w0, more = endOf(j) > w6, fade = !inst.some(() => true) || (w6 < base || w0 > monthEnd);
        return { t: (cont ? '‹ ' : '') + j.team.slice(3) + (b - a >= 1 ? ' · ' + nick(j) : ''), st: 'grid-column:' + (a + 1) + ' / ' + (b + 2) + ';grid-row:' + (lane[j.i] + 1) + ';background:' + c + '1F;color:' + c + ';box-shadow:inset ' + (cont ? '0' : '3px') + ' 0 0 ' + c
          + (cont ? ';border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0' : '') + (more ? ';border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0' : '') }; });
      return { days, bars, has: bars.length > 0 }; });
    v.mRows.forEach((r, ri) => r.days.forEach((c, k) => { const d = addD(start, ri * 7 + k); c.sv = d.getMonth() === base.getMonth() && JOBS.some(j => vis(j) && sameDay(j.survey, d)); }));

    // v5: capsule day styling + solid capsule bars
    const SELC = 'background:linear-gradient(160deg,#2A5A94,#16325C);color:#fff;font-weight:800;box-shadow:0 6px 14px rgba(22,50,92,0.32)';
    v.mRows.forEach((r, ri) => r.days.forEach((c, k) => { const d = addD(start, ri * 7 + k), inM = d.getMonth() === base.getMonth(), isSel = sameDay(d, sel), isT = sameDay(d, TODAY);
      c.numSt = isSel ? SELC : isT ? 'background:#E3EEF8;color:#1F6FB5;font-weight:800' : inM ? (d.getDay() === 0 ? 'color:#C2413A' : 'color:#16325C') : 'color:#B4BFCD;font-weight:400';
      c.mark = c.sv ? 'background:' + (isSel ? '#FFB547' : '#F08C00') : 'visibility:hidden'; }));
    v.mRows.forEach(r => r.bars.forEach(b => { b.st = b.st.replace(/background:(#[0-9A-Fa-f]{6})1F;color:#[0-9A-Fa-f]{6};box-shadow:inset (?:0|3px) 0 0 #[0-9A-Fa-f]{6}/, 'background:linear-gradient(90deg,$1,$1E6);color:#fff;box-shadow:0 2px 6px $155'); }));
    v.week.forEach((c, k) => { const d = addD(ws, k), isSel = sameDay(d, sel), isT = sameDay(d, TODAY);

    v.wBars.forEach(w => { const c = team(w.st.split('background:')[1] || ''), g = (w.st.match(/grid-column:[^;]+/) || [''])[0]; w.st = barSt(g, c, false); });

      const ds = inst.filter(j => d >= instOf(j) && d <= endOf(j)).map(j => ({ st: 'background:' + TEAM[j.team] + (inM ? '' : ';opacity:.35') }));
